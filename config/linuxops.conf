# LinuxOps configuration
# Every script loads this file. Change values here, not inside the scripts.
# Installed copy: /etc/linuxops/linuxops.conf

# Where every script writes its execution log
LOG_DIR="/var/log/linuxops"

# Group whose members administer the toolkit
ADMIN_GROUP="opsadmins"

# Disk monitoring: warning and critical thresholds (percent used)
DISK_WARN_PCT=80
DISK_CRIT_PCT=90

# Log cleanup: folders to clean, and age limits in days
LOG_CLEAN_DIRS="/var/log/linuxops"
LOG_COMPRESS_AFTER_DAYS=1
LOG_DELETE_AFTER_DAYS=14

# Health check: services that must be running, and minimum available memory
HEALTH_SERVICES="ssh cron"
MEM_MIN_AVAILABLE_PCT=10

# Security hardening
FIREWALL_ALLOWED_PORTS="22/tcp"     # space-separated, e.g. "22/tcp 80/tcp 443/tcp"
SSH_DISABLE_PASSWORD_LOGIN="no"     # set to "yes" only after SSH key login works

# Where removed users' home folders are archived
BACKUP_DIR="/var/backups/linuxops"
